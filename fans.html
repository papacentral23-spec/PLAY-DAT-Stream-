<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY-DAT GLOBAL</title><style>body{background:#111;color:#fff;font-family:Arial;margin:0;text-align:center}.top{background:#000;padding:10px}.top h1{color:#FFD700;margin:5px}.box{background:#222;border:2px solid #FFD700;margin:12px;border-radius:14px;padding:14px}button{background:#FFD700;color:#111;padding:14px;width:92%;border:0;font-weight:900;border-radius:20px;margin:6px}button.green{background:#25D366;color:#fff}button.blue{background:#2196F3;color:#fff}.song{background:#1a1a1a;padding:12px;margin:8px;border-radius:12px;text-align:left;border:1px solid #FFD700}</style></head><body>
<div class="top"><h1>PLAY-DAT</h1><p style="color:#FFD700">🌍 GLOBAL SYSTEM - PLAY-DAT</p><p>Fan pays to PLAY-DAT: 0539425180</p><p>SYSTEM pays 80% ARTIST - 20% PLAY-DAT</p><p>PLAY 5 FREE - AFTER PAY 0.50p</p></div>
<div class="box"><h3 style="color:#FFD700">🔥 TRENDING SONGS</h3><div id="list">No songs yet - </div></div>
<div class="box"><h3>⭐ PREMIUM 20 cedis</h3><button class="green" onclick="payPremium()">💰 PAY PREMIUM TO SYSTEM 0539425180</button></div>
<div class="box"><button class="blue" onclick="window.location='saver.html'">📤 GO TO SAVER - ARTIST REGISTER</button></div>
<script>
let songs=JSON.parse(localStorage.getItem('playdat_songs')||'[]');
let plays=JSON.parse(localStorage.getItem('playdat_plays')||'{}');
function show(){let l=document.getElementById('list');if(!songs.length){l.innerHTML='No songs yet - Go to SAVER';return}l.innerHTML=songs.map((s,i)=>{let c=plays[i]||0;let needPay=c>=5;let freeLeft=5-c;return `<div class="song"><b>${i+1}. ${s.song}</b> - ${s.artist}<br>💰 Fan pays to SYSTEM: 0539425180<br>📱 SYSTEM pays 80% to Artist: ${s.momo}<br>💛 SYSTEM keeps 20% PLAY-DAT<br>🎧 Plays: ${c} | ${needPay?'🔴 PAY 0.50p TO SYSTEM':'🟢 FREE LEFT: '+freeLeft}<br>${s.url?'<audio id="a'+i+'" controls src="'+s.url+'" style="width:100%"></audio>':''}<br><button onclick="playSong(${i})">${needPay?'💰 PAY 0.50p TO SYSTEM':'▶️ PLAY FREE'}</button><button class="green" onclick="supportArtist('${s.artist}','${s.momo}')">💚 SUPPORT VIA SYSTEM</button></div>`}).join('')}
show();
function playSong(i){let c=plays[i]||0;let s=songs[i];if(c<5){plays[i]=c+1;localStorage.setItem('playdat_plays',JSON.stringify(plays));let a=document.getElementById('a'+i);if(a)a.play();show();alert('✅ FREE PLAY '+(c+1)+'/5\n\n'+s.song);}else{let num=prompt('🔴 PAY 0.50p TO PLAY-DAT SYSTEM\n\nSend 0.50p MoMo to SYSTEM: 0539425180\nName: Osei Frank\n\nSYSTEM will pay:\n0.40p to Artist '+s.artist+' - '+s.momo+'\n0.10p to PLAY-DAT\n\nAfter you send, type YES');if(num&&num.toUpperCase()=='YES'){plays[i]=(plays[i]||0)+1;localStorage.setItem('playdat_plays',JSON.stringify(plays));let a=document.getElementById('a'+i);if(a)a.play();show();alert('✅ PAID TO SYSTEM!\n\nSYSTEM received 0.50p\nSYSTEM pays 0.40p to Artist '+s.artist+'\nSYSTEM keeps 0.10p PLAY-DAT\n\nPlaying now!');}}}
function supportArtist(name,momo){let amt=prompt('💚 SUPPORT '+name+' VIA SYSTEM\n\nPay to SYSTEM: 0539425180\n\nHow much? Example 5\n\nSYSTEM pays 80% to '+name+'\nSYSTEM keeps 20%');if(amt){let a=amt*0.8;let p=amt*0.2;alert('✅ PAY '+amt+' to SYSTEM 0539425180\n\nSYSTEM pays '+a+' to Artist '+name+' - '+momo+'\nSYSTEM keeps '+p+' PLAY-DAT\n\nThank you!');}}
function payPremium(){let p=prompt('⭐ PREMIUM 20 cedis\n\nPay to SYSTEM: 0539425180\nName: Osei Frank\n\nAfter send, type YES');if(p&&p.toUpperCase()=='YES'){localStorage.setItem('playdat_premium','yes');alert('✅ PREMIUM ACTIVATED!\n\n20 cedis to SYSTEM 0539425180');}}
</script></body></html>
