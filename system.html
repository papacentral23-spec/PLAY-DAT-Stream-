<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY-DAT SYSTEM</title><style>body{background:#111;color:#fff;font-family:Arial;margin:0;text-align:center}.top{background:#000;padding:10px}.top h1{color:#FFD700}.box{background:#222;border:2px solid #FFD700;margin:12px;border-radius:14px;padding:14px}button{background:#FFD700;color:#111;padding:14px;width:92%;border:0;font-weight:900;border-radius:20px;margin:6px}button.green{background:#25D366;color:#fff}button.blue{background:#2196F3;color:#fff}.song{background:#1a1a1a;padding:12px;margin:8px;border-radius:12px;text-align:left;border:1px solid #FFD700}</style></head><body>
<div class="top"><h1>PLAY-DAT SYSTEM</h1><p style="color:#FFD700">Osei Frank - GLOBAL</p><p>Fan pays to SYSTEM: 0539425180</p><p>SYSTEM pays 80% ARTIST - 20% PLAY-DAT</p></div>
<div class="box"><h3 style="color:#FFD700">SONGS</h3><div id="list">No songs yet</div></div>
<div class="box"><button class="blue" onclick="location='artists.html'">ARTISTS REGISTER</button><button class="blue" onclick="location='fans.html'">FANS</button><button class="blue" onclick="location='playdat.html'">RADIO</button></div>
<script>let songs=JSON.parse(localStorage.getItem('playdat_songs')||'[]');let plays=JSON.parse(localStorage.getItem('playdat_plays')||'{}');function show(){let l=document.getElementById('list');if(!songs.length){l.innerHTML='No songs yet - Go to artists.html';return}l.innerHTML=songs.map((s,i)=>{let c=plays[i]||0;let n=c>=5;return `<div class="song"><b>${s.song}</b> - ${s.artist}<br>Fan pays to SYSTEM 0539425180<br>SYSTEM pays 80% to ${s.momo}<br>Plays ${c}<br>${s.url?'<audio id="a'+i+'" controls src="'+s.url+'" style="width:100%"></audio>':''}<br><button onclick="playSong(${i})">${n?'PAY 0.50p TO SYSTEM':'PLAY FREE'}</button></div>`}).join('')}show();function playSong(i){let c=plays[i]||0;let s=songs[i];if(c<5){plays[i]=c+1;localStorage.setItem('playdat_plays',JSON.stringify(plays));let a=document.getElementById('a'+i);if(a)a.play();show();alert('FREE PLAY '+(c+1)+'/5')}else{let x=prompt('PAY 0.50p TO SYSTEM 0539425180\nSYSTEM pays 0.40p to '+s.artist+' '+s.momo+'\nType YES after send');if(x&&x.toUpperCase()=='YES'){plays[i]=c+1;localStorage.setItem('playdat_plays',JSON.stringify(plays));let a=document.getElementById('a'+i);if(a)a.play();show();alert('PAID TO SYSTEM!')}}}</script></body></html>
